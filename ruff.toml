# Lint rules: the 59 rules that were ruff's default before version 0.16.
# Pinned so that a ruff upgrade cannot change what counts as an error.
[lint]
select = ["E4", "E7", "E9", "F"]
# E712: "== True" is the intended pandas idiom for a boolean column.
# E731: short lambdas in tests.
ignore = ["E712", "E731"]

[lint.per-file-ignores]
# The 17-stock scripts are kept as published.
"scripts/first_study/*" = ["F841"]
